name: Complete Strapi 5.51 sync

on:
  push:
    branches:
      - issue/505-strapi-5-51-page-editor

permissions:
  contents: write

concurrency:
  group: complete-strapi-5-51-sync
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: issue/505-strapi-5-51-page-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: corepack enable
      - name: Regenerate merged lockfile
        run: yarn install --mode=update-lockfile
      - name: Validate distribution contract
        run: node creativesignal/container/scripts/verify-distribution.mjs . --source-only
      - name: Commit generated lockfile and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add yarn.lock
          git rm .github/workflows/complete-strapi-5-51-sync.yml
          git commit -m "chore: complete Creator Signal Strapi 5.51 sync"
          git push origin HEAD:issue/505-strapi-5-51-page-editor

# One-shot workflow; it removes itself after regenerating the merged lockfile.
